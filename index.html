<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equation</title>
  <link rel="stylesheet" href="./style/equation.css">
</head>
<body>
  <div class="eq-container">
    <h4 id="equation"></h4>
  </div>
  <div class="mainContainer">
    <div class="container">
      <h1">Binomial Equation</h1>
      <div class="inputBox">
        <label for="x-expo">Enter the coefficient</label>
        <input type="number" class="inputTag x-expo" id="x-expo" placeholder="Enter the coefficient" />
      </div>
      <div class="inputBox">
        <label for="x">Enter any letter</label>
        <input type="text" class="inputTag x-input" id="x" placeholder="(example letter x)" />
      </div>
      <div class="inputBox">
        <label for="y-expo">Enter the coefficient</label>
        <input type="number" id="y-expo" class="inputTag y-input y-expo" placeholder="Enter the coefficient" />
      </div>
      <div class="inputBox">
        <label for="y">Enter any letter </label>
        <input type="text" id="y" class="inputTag y-input" placeholder="(example letter y)" />
      </div>
      <div>
        <label for="n">Enter number of power</label>
        <input type="number" id="n" placeholder="Enter n" class="inputTag n-input" />
      </div>
      <div class="btnContainer">
        <button>Create</button>
      </div>
    </div>
  </div>
  <script src="./js/xandyValueEq.js"></script>
</body>
</html>
